# 奖学金重算与申诉系统
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# SQLite（本地文件，Hibernate 社区方言；非 Quarkus 内置驱动，db-kind 显式声明）
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:data/scholar.db?busy_timeout=5000
# SQLite 仅支持单写者：连接池保持小连接数，配合 busy_timeout 让写操作排队重试
quarkus.datasource.jdbc.max-size=3
quarkus.datasource.jdbc.min-size=1
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# 上传文件大小
quarkus.http.limits.max-body-size=20M

# 本地附件存储目录
app.storage.dir=data/attachments

# 测试环境使用独立的 SQLite 文件
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/test.db?busy_timeout=5000
%test.quarkus.datasource.jdbc.max-size=3
%test.quarkus.datasource.jdbc.min-size=1