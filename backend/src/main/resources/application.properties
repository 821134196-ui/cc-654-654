# 奖学金重算与申诉系统 — 本地配置
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# SQLite（本地文件库）
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:data/scholarship.db
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.validate-on-borrow=false

quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# 附件与上传
app.storage.dir=data/attachments
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.uploads-directory=data/tmp-uploads
quarkus.http.body.delete-uploaded-files-on-end=true

# 测试：共享内存 SQLite
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:file:memtest?mode=memory&cache=shared
%test.quarkus.datasource.jdbc.min-size=1
%test.quarkus.datasource.jdbc.max-size=1
%test.app.storage.dir=target/test-attachments
%test.quarkus.http.body.uploads-directory=target/test-uploads
